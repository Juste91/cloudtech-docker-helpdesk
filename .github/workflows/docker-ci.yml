name: Docker Build and Health Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Get project code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build Docker image
        run: docker build -t cloudtech-helpdesk:ci .

      - name: Start container
        run: |
          docker run -d \
            --name helpdesk-test \
            -p 127.0.0.1:8000:8000 \
            cloudtech-helpdesk:ci

      - name: Test health endpoint
        run: |
          for attempt in $(seq 1 15); do
            if curl --fail --silent --show-error \
              --max-time 5 \
              http://127.0.0.1:8000/health \
              -o health.json; then
              python3 -c 'import json; assert json.load(open("health.json")) == {"status": "healthy"}'
              echo "Health check passed!"
              exit 0
            fi
            echo "Waiting for API: attempt $attempt of 15"
            sleep 2
          done
          echo "API did not become ready"
          exit 1

      - name: Show container logs
        if: always()
        run: docker logs helpdesk-test || true

      - name: Remove test container
        if: always()
        run: docker rm -f helpdesk-test || true
